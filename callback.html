<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Authorization code — VideoBot</title>
  <style>
    body { font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; max-width: 640px; margin: 0 auto; padding: 2rem 1.25rem; line-height: 1.6; }
    h1 { font-size: 1.3rem; }
    #code { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 1.05rem; word-break: break-all; background: #f3f4f6; color: #111; border: 1px solid #d1d5db; border-radius: 8px; padding: 1rem; margin: 1rem 0; }
    button { font-size: 1rem; padding: .6rem 1rem; border-radius: 8px; border: 0; background: #2563eb; color: #fff; cursor: pointer; }
    .ok { color: #16a34a; }
    .err { color: #dc2626; }
    .muted { color: #888; }
  </style>
</head>
<body>
  <h1>VideoBot — authorization code</h1>
  <p>Copy the code below and paste it back into your terminal.</p>
  <div id="code">…</div>
  <button id="copy">Copy code</button>
  <span id="status" class="muted"></span>
  <p class="muted" id="extra"></p>

  <script>
    var p = new URLSearchParams(location.search);
    var code = p.get("code");
    var err = p.get("error") || p.get("error_description");
    var box = document.getElementById("code");
    var status = document.getElementById("status");
    if (code) {
      box.textContent = code;
      document.getElementById("extra").textContent = "state: " + (p.get("state") || "(none)");
    } else {
      box.textContent = err ? ("Error: " + err) : "No code found in the URL.";
      box.className = "err";
    }
    document.getElementById("copy").addEventListener("click", function () {
      navigator.clipboard.writeText(code || "").then(function () {
        status.textContent = "Copied!";
        status.className = "ok";
      });
    });
  </script>
</body>
</html>
